@if (contacts().length > 0) {
    <div class="overview-section">
        <div class="overview-section__header">
            <h2 class="overview-section__title">Recent Contacts</h2>
            <a routerLink="/contacts" class="overview-section__link">View all</a>
        </div>
        <div class="data-table">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>App</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    @for (contact of contacts(); track contact.id) {
                        <tr>
                            <td>#{{ contact.name }}</td>
                            <td>{{ contact.subject }}</td>
                            <td>{{ contact.app_name }}</td>
                            <td>
                                <span 
                                    class="badge" 
                                    [ngClass]="getStatusClass(contact.status)">
                                    {{ contact.status }}
                                </span>
                            </td>
                            <td>{{ contact.created_at | date:'dd/MM/yyyy' }}</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
}
