@if (orders().length > 0) {
    <div class="overview-section">
        <div class="overview-section__header">
            <h2 class="overview-section__title">Recent Orders</h2>
            <a routerLink="/orders" class="overview-section__link">View all</a>
        </div>
        <div class="data-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>App</th>
                        <th>Status</th>
                        <th>Total</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    @for (order of orders(); track order.id) {
                        <tr>
                            <td>#{{ order.status }}</td>
                            <td>{{ order.app_name }}</td>
                            <td>
                                <span 
                                    class="badge" 
                                    [ngClass]="getStatusClass(order.status)">
                                    {{ order.status }}
                                </span>
                            </td>
                            <td>{{ formatRevenue(order.total_amount) }}</td>
                            <td>{{ order.created_at | date:'dd/MM/yyyy' }}</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
}
