<div class="product-list">
    <!-- Header -->
    <div class="product-list__header">
        <div>
            <h2 class="product-list__title">Products</h2>
            <p class="product-list__subtitle">
                {{ pagination()?.total ?? 0 }} products total
            </p>
        </div>
        <a [routerLink]="'/products/new'" class="btn btn--primary">
            + Add Product
        </a>
    </div>

    <!-- Search + filters -->
    <div class="product-list__toolbar">
        <lib-search-bar 
            [placeholder]="'Search products...'"
            [filters]="searchFilters" 
            (search)="onSearch($event)" 
            (filterChange)="onFilterChanger($event)" />
    </div>

    <!-- Table -->
    <div class="product-list__table">
        <lib-data-table 
            [columns]="COLUMNS"
            [rows]="products()"
            [actions]="ACTIONS"
            [pagination]="pagination()"
            [loading]="loading()"
            [emptyText]="'No products yet. Add your frist product.'"
            (pageChange)="onPageChange($event)"
            (rowAction)="onRowAction($event)" />
    </div>

    <!-- Delete confirm dialog -->
    @if (deleteTarget()) {
        <lib-confirm-dialog 
            [title]="'Delete Product'"
            [message]="'Are you sure you want to delete ' + deleteTarget()!.name + '? This cannot be undone.'"
            [confirmLabel]="'Delete'"
            [danger]="true"
            [loading]="deleting()"
            (confirmed)="onDeleteConfirmed()"
            (cancelled)="onDeleteCancelled()" />
    }
</div>
