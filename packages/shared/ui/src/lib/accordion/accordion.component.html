<ul class="accordion" [attr.data-depth]="depth()">
    @for (item of items(); track item.id) {
        <li class="accordion__item">
            @if (hasChildren(item)) {
                <!-- Parent item with toggle -->
                 <button 
                    type="button" 
                    class="accordion__trigger"
                    [class.is-open]="isOpen(item.id)()"
                    (click)="toggle(item.id)">
                    
                    <div class="accordion__info">
                        @if (item.icon) {
                            <lib-icon [name]="item.icon" [size]="18"/>
                        } @else {
                            <span class="accordion__child-dot"></span>
                        }
                        <span class="accordion__label">{{ item.label }}</span>
                        @if (item.badge) {
                            <span class="accordion__badge">{{ item.badge }}</span>
                        }
                    </div>

                    <lib-icon 
                        name="chevron-down" 
                        [size]="14"
                        class="accordion__chevron"
                        [class.is-rotated]="isOpen(item.id)()" />
                </button>

                <!-- Recursive Children -->
                <div 
                    class="accordion__children"
                    [class.is-open]="isOpen(item.id)()"
                    [class]="'child-level-' + depth()">
                    <lib-accordion 
                        [items]="item.children!" 
                        [depth]="depth() + 1"/>
                </div>
            } @else {
                <a 
                    [routerLink]="item.route"
                    routerLinkActive="is-active"
                    [class.is-link]="true"
                    class="accordion__trigger">
                    <div class="accordion__info">
                        @if (item.icon) {
                            <lib-icon [name]="item.icon" [size]="18"/>
                        } @else {
                            <span class="accordion__child-dot"></span>
                        }
                        <span class="accordion__label">{{ item.label }}</span>
                        @if (item.badge) {
                            <span class="accordion__badge">{{ item.badge }}</span>
                        }
                    </div>
                </a>
            }
        </li>
    }
</ul>
