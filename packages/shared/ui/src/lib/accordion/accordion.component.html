<ul class="accordion">
    @for (item of items(); track item.id) {
        <li class="accordion__item">
            @if (hasChildren(item)) {
                <!-- Parent item with toggle -->
                 <button 
                    type="button" 
                    class="accordion__trigger"
                    [class.is-open]="isOpen(item.id)()"
                    (click)="toggle(item.id)">
                    @if (item.icon) {
                        <lib-icon [name]="item.icon" [size]="18"/>
                    }
                    <span class="accordion__label">{{ item.label }}</span>
                    @if (item.badge) {
                        <span class="accordion__badge">{{ item.badge }}</span>
                    }
                    <lib-icon 
                        name="chevron-down" 
                        [size]="14"
                        class="accordion__chevron"
                        [class.is-rotated]="isOpen(item.id)()" />
                </button>

                <!-- Children -->
                <ul class="accordion__children"
                    [class.is-open]="isOpen(item.id)()">
                    @for (child of item.children!; track child.id) {
                        <li class="accordion__child">
                            <a 
                                [routerLink]="child.route"
                                routerLinkActive="is-active" 
                                class="accordion__child-link">
                                <span class="accordion__child-dot"></span>
                                <span class="accordion__label">{{ child.label }}</span>
                                @if (child.badge) {
                                    <span class="accordion__badge">{{ child.badge }}</span>
                                }
                            </a>
                        </li>
                    }
                </ul>
            } @else {
                <a 
                    [routerLink]="item.route"
                    routerLinkActive="is-active"
                    [class.is-link]="true"
                    class="accordion__trigger">
                    @if (item.icon) {
                        <lib-icon [name]="item.icon" [size]="18"/>
                    }
                    <span class="accordion__label">{{ item.label }}</span>
                    @if (item.badge) {
                        <span class="accordion__badge">{{ item.badge }}</span>
                    }
                </a>
            }
        </li>
    }
</ul>
