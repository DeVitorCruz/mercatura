<div class="auth-page">
    <div class="auth-card">
        <h2 class="auth-card__title">Create Account</h2>
        <p class="auth-card__subtitle">Join us today - it's free!</p>

        <lib-ui-form
            [config]="FORM_CONFIG"
            [loading]="LOADING()"
            [error]="ERROR()"
            (formSubmit)="onSubmit()">
        </lib-ui-form>

        <p class="auth-card__footer">
            Already have a account?
            <a [routerLink]="'/auth/login'">Sign in</a>
        </p>
    </div>
</div>
