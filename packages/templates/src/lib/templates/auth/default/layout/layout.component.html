<div class="auth-shell">
    <div class="auth-shell__container">
        <div class="auth-shell__row">
            
            <!-- Left panel - Swiper slides -->
            <div class="auth-shell__left">
                <div class="auth-shell__left-img-sec">
                    <img [src]="IMG_PATH" alt="">
                </div>
                <lib-slider
                    [config]="SLIDE_CONFIG" />
            </div>
            
            <!-- Right panel - tab nav + router outlet -->
            <div class="auth-shell__right">
                <div class="auth-shell__card">
                    <div class="auth-shell__card--layer">
                        
                        <!-- Tab navigation -->
                        <div class="auth-shell__tabs">
                            <ul class="auth-shell__list">
                                <li class="auth-shell__list-item">
                                    <a
                                        routerLink="login"
                                        class="auth-shell__tab"
                                        [class.is-active]="isLogin()">
                                        Login
                                    </a>
                                </li>
                                <li class="auth-shell__list-item">
                                    <a
                                        routerLink="register"
                                        class="auth-shell__tab"
                                        [class.is-active]="!isLogin()">
                                        Register
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <!-- Form outlet -->
                        <div class="auth-shell__content">
                            <router-outlet />
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
