<header class="platform-header">
    <div class="platform-header__layer">
        <div class="platform-header__row">
            
            <div class="platform-header__left">
                <div class="platform-header__left-content">
                    <a [href]="headerConfig().logo.link" class="platform-header__logo">
                        <img [src]="headerConfig().logo.url" alt="logo">
                    </a>
                    <button
                        class="platform-header__menu-btn"
                        type="button"
                        (click)="onMenuToggle()">
                        <lib-icon
                            [name]="headerConfig().sidebarIcon.name"
                            [size]="headerConfig().sidebarIcon.size"/>
                    </button>
                </div>
            </div>

            <div class="platform-header__right">
                <ul class="platform-header__content-btn">
                    @for (icon of headerConfig().icons; track icon) {
                        <li class="platform-header__badge">
                            <lib-icon [name]="icon.name" [size]="icon.size"/>
                        </li>
                    }
                    @if (headerConfig().user) {
                        <li class="platform-header__badge platform-header__user"
                            (click)="toggleDropdown()"
                            (clickOutside)="closeDropdown()">
    
                            <button class="platform-header__avatar-btn" type="button">
                                @if (headerConfig().user!.avatarUrl) {
                                    <img 
                                        [src]="headerConfig().user!.avatarUrl" 
                                        [alt]="headerConfig().user!.name"
                                        class="platform-header__avatar">
                                } @else {
                                    <lib-icon name="person-circle" [size]="20" />
                                }
                                @if (headerConfig().user!.name) {
                                    <span class="platform-header__user-name">
                                        {{ headerConfig().user!.name }}
                                    </span>
                                }
                                <lib-icon name="chevron-down" [size]="12" />
                            </button>
                            
                            <!-- Dropdown -->
                            @if (dropdownOpen()) {
                                <ul class="platform-header__dropdown">
                                    @for (item of headerConfig().user!.dropdownItems; track item.label) {
                                        <li 
                                            class="platform-header__dropdown-item"
                                            [class.is-danger]="item.action === 'logout'"
                                            (click)="onDropdownAction(item.action, item.route)">
                                            <lib-icon [name]="item.icon" [size]="16" />
                                            <span>{{ item.label }}</span>
                                        </li>
                                    }
                                </ul>
                            }
    
                        </li>
                    }
                </ul>


                <ul class="platform-header__content-hidden">
                    <li class="platform-header__badge">
                        <lib-icon 
                            [name]="headerConfig().hiddenIcon.name" 
                            [size]="headerConfig().hiddenIcon.size"/>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</header>
