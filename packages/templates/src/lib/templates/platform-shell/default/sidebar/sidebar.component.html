<div class="platform-sidebar">
    
    <!-- Brand -->
    <div class="platform-sidebar__brand">
        @if (brandLogo()) {
            <img class="platform-sidebar__logo"
                [src]="brandLogo()" 
                [alt]="brandName()">
        } @else {
            <span class="platform-sidebar__brand-name">{{ brandName() }}</span>
        }
    </div>

    <!-- Navigation -->
    <nav class="platform-sidebar__nav">
        <lib-accordion [items]="navItems()"/>
    </nav>  
</div>
